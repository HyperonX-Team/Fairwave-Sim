name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC

permissions:
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - name: Build
        run: |
          go build ./core/fairwave-control/cmd/fairwave-control
          go build ./core/fairwave-agent/cmd/fairwave-agent
          go build ./apps/fairwave-cli/cmd/fairwave
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
