# Fairwave WireGuard mesh — example peer config
#
# Placeholders below are managed by the fairwave control plane, which
# generates keys, assigns 10.99.0.0/16 addresses and rewrites wg0.conf when
# peers enroll/leave (see core/peering/README.md). NEVER commit a real key;
# commit only this template.

[Interface]
# Mesh address of this node (assigned by fairwave-control, never chosen by hand)
Address = 10.99.0.1/16
ListenPort = 51820
# Private key — generated by `wg genkey` and stored ONLY in the node's
# protected store (/etc/fairwave/env on hosts, Kubernetes Secret in helm).
PrivateKey = <BASE64_PRIVATE_KEY_CONTROLLED_BY_CONTROL_PLANE>
# No default routing through the mesh; breakout decisions are per-peer and
# made by the control plane (local_breakout policy).
Table = off
# Optional: mark traffic for asymmetric routing / fwmark based policy routing
# FwMark = 0xca6c

[Peer]
# One Peer section per enrolled node, appended by fairwave-control.
# AllowedIPs only covers the peer's mesh address and any prefixes the peer
# advertises for breakout (e.g. its UE pool) — nothing more.
PublicKey = <BASE64_PEER_PUBLIC_KEY>
AllowedIPs = 10.99.0.2/32, 10.45.0.0/16
Endpoint = <PUBLIC_IP_OR_HOSTNAME>:51820
PersistentKeepalive = 25
