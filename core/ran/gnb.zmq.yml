# Fairwave srsGNB config - ZMQ VIRTUAL RADIO (5G SA lab). No antenna, no RF.
#
# srsRAN_Project 24.10 gNB (the pinned build in deploy/docker/Dockerfile.srsran).
# The shape was verified against the 24.10 configs/ examples and by running
# the built `gnb` binary: in 24.10 the tracking areas / PLMN / slice lists
# nest INSIDE cu_cp.amf (not under cu_cp), and there is no cu_up section
# (24.10 rejects it; N3 binds the container's default interface).
#
# The UE shares this container's network namespace (network_mode:
# service:gnb in the 5G compose), so the ZMQ radio runs over localhost
# exactly like the 4G lab.
#
# Everything here must agree with core/free5gc/amfcfg.yaml and the SIM
# test vectors: PLMN 999-99 ("99999"), TAC 1, slice SST 1 / SD 010203
# (sd is DECIMAL here: 0x010203 = 66051), DNN internet.
cu_cp:
  amf:
    addr: 10.100.200.16 # pinned AMF (docker-compose.5g.yml)
    port: 38412
    bind_addr: 10.100.200.100 # this gNB container's pinned IP
    supported_tracking_areas:
      - tac: 1
        plmn_list:
          - plmn: "99999"
            tai_slice_support_list:
              - sst: 1
                sd: 66051 # 0x010203
  inactivity_timer: 7200

ru_sdr:
  device_driver: zmq
  device_args: tx_port=tcp://*:2000,rx_port=tcp://127.0.0.1:2001,base_srate=23.04e6
  srate: 23.04
  tx_gain: 75
  rx_gain: 75

cell_cfg:
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 20
  common_scs: 15
  plmn: "99999"
  tac: 1
  pdcch:
    dedicated:
      ss2_type: common
      dci_format_0_1_and_1_1: false
    common:
      ss0_index: 0
      coreset0_index: 12
  prach:
    prach_config_index: 1
  pdsch:
    mcs_table: qam64
  pusch:
    mcs_table: qam64

log:
  filename: /tmp/gnb.log
  all_level: info
  hex_max_size: 0
