# Fairwave Open5GS v2.7.x - PCRF (lab). Loopback 127.0.0.9 (Gx).
# db_uri is REQUIRED: the PCRF only initializes mongoc when it is set
# (pcrf-init.c: ogs_dbi_init(ogs_app()->db_uri)); without it the Gx CCR
# handler aborts inside libmongoc on the first policy query.
db_uri: mongodb://mongo:27017/open5gs
logger:
  file:
    path: /var/log/open5gs/pcrf.log
  level: info

global:
  max:
    ue: 16

pcrf:
  freeDiameter: /usr/local/etc/freeDiameter/pcrf.conf
