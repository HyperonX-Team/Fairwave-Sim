# Fairwave SIM profile — production.
#
# !!! MUST NOT RUN WITHOUT HSM/SECURE IMPORT !!!
#
# A prod profile assumes real, operator-assigned IMSI ranges and real Ki/OPc
# material. The provisioner and control plane therefore REQUIRE, before any
# prod issuance or activation:
#   1. hsm_import  — Ki/OPc created inside an HSM-backed vault (or imported
#                    through a secure key ceremony), never generated on the
#                    issuing machine's disk.
#   2. license_ref — a valid spectrum/operator license reference recorded
#                    with the issuance (audit trail, not a convenience).
# If either gate is missing the control plane returns an error and refuses
# to issue. Do not weaken these gates; they are the difference between a
# community project and a regulatory incident.

name: prod
description: Operator production SIMs — HSM-gated issuance only.
class: production

requires:
  - hsm_import            # hard requirement: HSM-backed credential import
  - license_ref           # hard requirement: license reference on file
  - operator_approval     # human approval workflow before issuance

imsi_prefix: ""           # MUST be set per operator allocation (15 digits max)
plmn:
  mcc: 0                  # operator-assigned; never 999 (test range)
  mnc: 0

security:
  algorithm: milenage
  key_size: 128
  opc_derivation: true

apns:
  - internet
  - ims

validity_days: 365

# Prod SIMs are NEVER auto-loaded anywhere; loading is a separate, logged,
# approval-gated operation (bureau runbook).
hss_auto_load: false
