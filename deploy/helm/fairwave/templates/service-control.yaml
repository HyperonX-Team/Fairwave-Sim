apiVersion: v1
kind: Service
metadata:
  name: {{ include "fairwave.fullname" . }}-control
  labels:
    {{- include "fairwave.labels" . | nindent 4 }}
spec:
  type: {{ .Values.control.service.type }}
  ports:
    - name: http
      port: {{ .Values.control.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "fairwave.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: control
