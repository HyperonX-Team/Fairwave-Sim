apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fairwave.fullname" . }}-control
  labels:
    {{- include "fairwave.labels" . | nindent 4 }}
data:
  fairwave-control.yaml: |
    version: 1
    mode: {{ .Values.control.config.mode | quote }}
    listen_addr: {{ .Values.control.config.listenAddr | quote }}
    data_dir: {{ .Values.control.config.dataDir | quote }}
    plmn:
      mcc: {{ .Values.control.config.plmn.mcc }}
      mnc: {{ .Values.control.config.plmn.mnc }}
    tac: {{ .Values.control.config.tac }}
    apns:
      {{- range .Values.control.config.apns }}
      - {{ . | quote }}
      {{- end }}
    max_ues: {{ .Values.control.config.maxUes }}
    policy:
      local_breakout: {{ .Values.control.config.localBreakout }}
      hub_peer: {{ .Values.control.config.hubPeer | quote }}
